import groovy.io.FileType

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// ============================================================================
// client-extensions-k8s.gradle
//
// Deploy Liferay Client Extensions into the k3s recipe as real Kubernetes
// workloads. Replaces the podman + kopf operator + CRD + file-watcher.
//
// ./gradlew deployClientExtensions build/import/apply every CX
// ./gradlew renderClientExtensions dry run: print manifests only
// ./gradlew clientExtensionStatus CRD-style status table (live)
//
// NO directory convention. CX are discovered recursively under client-extensions:
// *.zip -> a supplied artifact (unzipped, then imaged)
// any dir containing LCP.json -> a built-from-source CX (imaged directly)
// The virtual instance is an EXTERNAL deploy-time signal (archives only carry
// the "default" placeholder). Resolution precedence (first match wins):
// 1. client-extensions/virtual-instances.properties (<name|sid> = vid)
// 2. -PvirtualInstance.<name|sid>=vid (per-CX property)
// 3. -PvirtualInstanceId=vid (workspace default)
// 4. "default" (existing workspaces need nothing)
//
// Networking is handled by the recipe (NodePort in, CoreDNS->docker-DNS
// forwarder out), so nothing here needs Liferay's IP or a hostAlias.
//
// apply from: "gradle/client-extensions-k8s.gradle"
// ============================================================================

ext.containerdSocket = "/run/k3s/containerd/containerd.sock"
ext.cxRoot = file(project.findProperty("cxRoot") ?: "client-extensions")
ext.k3s = project.findProperty("k3s") ?: "k3s-lec"
ext.k3sHost = project.findProperty("k3sHost") ?: "k3s"
ext.liferayAddress = project.findProperty("liferayAddress") ?: "liferay:8080"
ext.managedLabel = "lxc.liferay.com/managed"
ext.traefikImage = "traefik:v3.1"

// The agent names dxp/ext-init ConfigMaps by the instance webId
// (company.getWebId()). Resolve it the same way Liferay does: -PwebId override >
// company.default.web.id in portal-ext.properties > "liferay.com" (Liferay's own
// default). No database needed.

String resolveWebId() {
	String webIdOverride = project.findProperty("webId")

	if (webIdOverride) {
		return webIdOverride
	}

	File portalExtProperties = file("configs/common/portal-ext.properties")

	if (portalExtProperties.exists()) {
		def matcher = (portalExtProperties.text =~ /(?m)^[ \t]*company\.default\.web\.id[ \t]*=[ \t]*(\S+)/)

		if (matcher.find()) {
			return matcher.group(1)
		}
	}

	return "liferay.com"
}

ext.webId = resolveWebId()

// Discovery: a source CX (directory with LCP.json) or a supplied artifact
// (*.zip), in any layout under client-extensions.

List<File> discoverClientExtensions() {
	List<File> clientExtensions = []

	if (!cxRoot.isDirectory()) {
		return clientExtensions
	}

	cxRoot.eachFileRecurse(FileType.FILES) {
		File file ->

		if (file.name.endsWith(".zip")) {
			clientExtensions << file
		}
	}

	cxRoot.traverse(type: FileType.DIRECTORIES) {
		File dir ->

		if (new File(dir, "LCP.json").exists()) {
			clientExtensions << dir
		}
	}

	return clientExtensions
}

// Normalize an entry to a directory that has LCP.json. Only place where the
// zip-vs-source distinction matters.

File materialize(File entry) {
	if (entry.isDirectory()) {
		return entry
	}

	File dest = new File(buildDir, "cx/${entry.name - '.zip'}")

	delete dest

	copy {
		from zipTree(entry)
		into dest
	}

	return dest
}

// External virtual-instance signal (archives only carry the "default"
// placeholder), resolved by precedence: file mapping > per-CX property >
// workspace default > "default".

ext.viMappingFile = file(project.findProperty("viMapping") ?: new File(cxRoot, "virtual-instances.properties"))

Properties loadViMap() {
	Properties properties = new Properties()

	if (viMappingFile.exists()) {
		viMappingFile.withInputStream {
			InputStream inputStream ->

			properties.load(inputStream)
		}
	}

	return properties
}

String resolveVirtualInstance(String sid, String name) {
	Properties viMap = loadViMap()

	List<String> candidates = [
		viMap.getProperty(name),
		viMap.getProperty(sid),
		project.findProperty("virtualInstance.${name}"),
		project.findProperty("virtualInstance.${sid}"),
		project.findProperty("virtualInstanceId")
	]

	return candidates.find {
		it
	} ?: "default"
}

// Preview-only NodePort (the real port is k8s-assigned); used by
// renderClientExtensions.

int nodePortFor(String sid) {
	return 30000 + (Math.abs(sid.hashCode()) % 2500)
}

// Build the k8s manifests for one CX. The NodePort is left for k8s to assign
// (unique + sticky across redeploys), so the Service is applied first and its
// port read back before the ext-provision ConfigMap (which needs the address)
// is rendered. Serving CX also get an Ingress on <sid>.<vid>.localtest.me so a
// browser can reach them with a CORS-correct origin.

Map manifestFor(File dir, String name) {
	def lcp = new JsonSlurper().parse(new File(dir, "LCP.json"))

	String sid = lcp.id
	String vid = resolveVirtualInstance(sid, name)

	// vid-independent: one image, the registration carries the virtual instance.

	String image = "lxc/${sid}:latest"

	String kind = (lcp.kind ?: "Deployment").toString()

	boolean isCronJob = kind.equalsIgnoreCase("cronjob")
	boolean isDeployment = kind.equalsIgnoreCase("deployment")
	boolean isJob = kind.equalsIgnoreCase("job")

	def port = lcp.loadBalancer?.targetPort

	// Only Deployments serve traffic; Jobs/CronJobs run and exit.

	boolean hasService = (port && isDeployment) as boolean

	String ingressHost = hasService ? "${sid}.${vid}.localtest.me" : null
	String ingressUrl = ingressHost ? "http://${ingressHost}" : null

	Map<String, String> selector = [app: sid, domain: vid]

	Map container = [
		env: (lcp.env ?: [:]).collect {
			key, value ->

			[name: key, value: value.toString()]
		},
		image: image,
		imagePullPolicy: "IfNotPresent",
		name: "main",
		volumeMounts: [
			[mountPath: "/etc/liferay/lxc/ext-provision-metadata", name: "ext-provision", readOnly: true],
			[mountPath: "/etc/liferay/lxc/dxp-metadata", name: "dxp", readOnly: true],
			[mountPath: "/etc/liferay/lxc/ext-init-metadata", name: "ext-init", readOnly: true]
		]
	]

	if (port) {
		container.ports = [[containerPort: port]]
	}

	if (lcp.livenessProbe) {
		container.livenessProbe = lcp.livenessProbe
	}

	if (lcp.readinessProbe) {
		container.readinessProbe = lcp.readinessProbe
	}

	// OAuth CX expect the portal at localhost:80; bridge to liferay:8080 with a
	// socat sidecar (as the kopf operator did; "liferay" resolves via the
	// forwarder).

	boolean needsLiferay = dir.listFiles(
		{
			File file ->

			file.name.endsWith(".client-extension-config.json")
		} as FileFilter)?.any {
		File configFile ->

		new JsonSlurper().parse(configFile).values().any {
			it instanceof Map && ((it.type == "oAuthApplicationUserAgent") || (it.type == "oAuthApplicationHeadlessServer"))
		}
	} ?: false

	Map podSpec = [
		containers: [container],
		volumes: [
			[configMap: [name: "${sid}-ext-provision"], name: "ext-provision"],

			// dxp + ext-init are created by PortalK8sAgent AFTER registration,
			// named by the instance webId; mounted optional so the pod starts and
			// the kubelet syncs them in once the agent creates them.

			[configMap: [name: "${webId}-lxc-dxp-metadata", optional: true], name: "dxp"],
			[configMap: [name: "${sid}-${webId}-lxc-ext-init-metadata", optional: true], name: "ext-init"]
		]
	]

	// socat bridge as a NATIVE sidecar (initContainer + restartPolicy: Always):
	// starts before main, is torn down when main exits, and does NOT block Job
	// completion, so one-shot/noop CX (kind: Job) complete instead of hanging at
	// 1/2.

	if (needsLiferay) {
		podSpec.initContainers = [
			[
				args: ["TCP-LISTEN:80,fork,reuseaddr", "TCP:${liferayAddress}"],
				image: "alpine/socat:latest",
				imagePullPolicy: "IfNotPresent",
				name: "liferay-proxy",
				restartPolicy: "Always"
			]
		]
	}

	Map<String, String> annotations = [
		"lxc.liferay.com/app-id": sid,
		"lxc.liferay.com/virtual-instance": vid
	]

	if (ingressUrl) {
		annotations["lxc.liferay.com/url"] = ingressUrl
	}

	Closure baseMeta = {
		Map extra ->

		[labels: [(managedLabel): "true"] + selector] + extra
	}

	// Phase 1: the Service alone, WITHOUT a nodePort, so k8s assigns a unique,
	// sticky one.

	String serviceJson = null

	if (hasService) {
		serviceJson = JsonOutput.toJson([
			apiVersion: "v1",
			kind: "Service",
			metadata: baseMeta([name: sid]),
			spec: [
				ports: [[port: port, targetPort: port]],
				selector: selector,
				type: "NodePort"
			]
		])
	}

	// Phase 2: workload + Ingress + ext-provision ConfigMap, rendered once the
	// nodePort is known.

	Closure restFor = {
		nodePort ->

		List items = []

		if (isCronJob) {
			podSpec.restartPolicy = "Never"

			items << [
				apiVersion: "batch/v1",
				kind: "CronJob",
				metadata: baseMeta([annotations: annotations, name: sid]),
				spec: [
					concurrencyPolicy: (lcp.concurrencyPolicy ?: "Forbid"),
					jobTemplate: [
						spec: [
							backoffLimit: 6,
							template: [metadata: [labels: [(managedLabel): "true"] + selector], spec: podSpec]
						]
					],
					schedule: lcp.schedule
				]
			]
		}
		else if (isJob) {
			podSpec.restartPolicy = "Never"

			items << [
				apiVersion: "batch/v1",
				kind: "Job",
				metadata: baseMeta([annotations: annotations, name: sid]),
				spec: [
					backoffLimit: 6,
					template: [metadata: [labels: [(managedLabel): "true"] + selector], spec: podSpec],
					ttlSecondsAfterFinished: 600
				]
			]
		}
		else {
			items << [
				apiVersion: "apps/v1",
				kind: "Deployment",
				metadata: baseMeta([annotations: annotations, name: sid]),
				spec: [
					replicas: (lcp.scale ?: 1),
					selector: [matchLabels: selector],
					template: [metadata: [labels: [(managedLabel): "true"] + selector], spec: podSpec]
				]
			]

			if (hasService) {
				items << [
					apiVersion: "networking.k8s.io/v1",
					kind: "Ingress",
					metadata: baseMeta([name: sid]),
					spec: [
						ingressClassName: "traefik",
						rules: [
							[
								host: ingressHost,
								http: [
									paths: [
										[
											backend: [service: [name: sid, port: [number: port]]],
											path: "/",
											pathType: "Prefix"
										]
									]
								]
							]
						]
					]
				]
			}
		}

		// The ext-provision ConfigMap is the registration PortalK8sAgent reads. A
		// browser origin -> the ingress URL (CORS); Liferay backend calls ->
		// k3s:<nodePort>.

		String serviceAddress = nodePort ? "${k3sHost}:${nodePort}" : null

		Map data = [:]

		dir.listFiles(
			{
				File file ->

				file.name.endsWith(".client-extension-config.json")
			} as FileFilter)?.each {
			File configFile ->

			def config = new JsonSlurper().parse(configFile)

			config.each {
				key, value ->

				if (value instanceof Map) {

					// objectAction is a server-side webhook: the Liferay backend
					// calls baseURL + resourcePath. It must use the in-cluster
					// NodePort (k3s:<nodePort>) -- the browser ingress host
					// (<sid>.<vid>.localtest.me) resolves to 127.0.0.1 inside the
					// Liferay container (i.e. Liferay itself), so it is not
					// reachable server-side. Browser-facing CX (custom elements,
					// etc.) load from the ingress URL.

					boolean serverSideCallback = value.type == "objectAction"

					if (value.containsKey("baseURL")) {
						if (serverSideCallback && serviceAddress) {
							value.baseURL = "http://${serviceAddress}"
						}
						else if (ingressUrl) {
							value.baseURL = ingressUrl
						}
					}

					if (ingressUrl && value.containsKey("homePageURL")) {
						value.homePageURL = ingressUrl
					}

					if (serviceAddress && value.containsKey(".serviceAddress")) {
						value[".serviceAddress"] = serviceAddress
					}
				}
			}

			data[configFile.name] = JsonOutput.toJson(config)
		}

		items << [
			apiVersion: "v1",
			data: data,
			kind: "ConfigMap",
			metadata: [
				annotations: ["lxc.liferay.com/lcp-json": JsonOutput.toJson(lcp)],
				labels: [
					(managedLabel): "true",
					"dxp.lxc.liferay.com/virtualInstanceId": vid,
					"ext.lxc.liferay.com/serviceId": sid,
					"lxc.liferay.com/metadataType": "ext-provision"
				],
				name: "${sid}-ext-provision"
			]
		]

		return JsonOutput.toJson([apiVersion: "v1", items: items, kind: "List"])
	}

	return [
		hasService: hasService,
		image: image,
		ingressUrl: ingressUrl,
		isCronJob: isCronJob,
		isJob: isJob,
		needsLiferay: needsLiferay,
		restFor: restFor,
		serviceJson: serviceJson,
		sid: sid,
		vid: vid
	]
}

void kubectlApply(String json) {
	exec {
		commandLine "docker", "exec", "-i", k3s, "kubectl", "apply", "-f", "-"
		standardInput = new ByteArrayInputStream(json.getBytes("UTF-8"))
	}
}

// Build (or unpack) -> image -> import -> apply -> restart, for ONE client
// extension. Reused by deployClientExtensions and each module's deployToK3s.

ext.deployOneCx = {
	File entry ->

	String name = entry.isDirectory() ? entry.name : (entry.name - ".zip")

	File dir = materialize(entry)

	if (!new File(dir, "LCP.json").exists()) {
		logger.warn("skip ${entry.name}: no LCP.json")

		return
	}

	Map manifest = manifestFor(dir, name)

	logger.lifecycle(">> ${manifest.vid}/${manifest.sid} (image ${manifest.image})")

	if (manifest.needsLiferay) {
		exec {
			commandLine "bash", "-c", "docker image inspect alpine/socat:latest >/dev/null 2>&1 || docker pull -q alpine/socat:latest; docker save alpine/socat:latest | docker exec -i ${k3s} ctr -a ${containerdSocket} -n k8s.io images import -"
		}
	}

	exec {
		commandLine "docker", "build", "-q", "-t", manifest.image, dir.absolutePath
	}

	exec {
		commandLine "bash", "-c", "docker save ${manifest.image} | docker exec -i ${k3s} ctr -a ${containerdSocket} -n k8s.io images import -"
	}

	// Phase 1: apply the Service so k8s assigns the NodePort, then read it back.

	def nodePort = null

	if (manifest.hasService) {
		kubectlApply(manifest.serviceJson)

		ByteArrayOutputStream out = new ByteArrayOutputStream()

		exec {
			commandLine "docker", "exec", k3s, "kubectl", "get", "svc", manifest.sid, "-o", "jsonpath={.spec.ports[0].nodePort}"
			standardOutput = out
		}

		nodePort = out.toString().trim().toInteger()
	}

	// Phase 2: workload + Ingress + ext-provision ConfigMap (with the resolved
	// address). The :latest tag means apply won't roll, so Jobs/CronJobs
	// delete+recreate and Deployments rollout restart.

	if (manifest.isJob) {
		exec {
			commandLine "docker", "exec", k3s, "kubectl", "delete", "job", manifest.sid, "--ignore-not-found"
		}
	}
	else if (manifest.isCronJob) {
		exec {
			commandLine "docker", "exec", k3s, "kubectl", "delete", "cronjob", manifest.sid, "--ignore-not-found"
		}
	}

	kubectlApply(manifest.restFor(nodePort))

	if (!manifest.isJob && !manifest.isCronJob) {
		exec {
			commandLine "docker", "exec", k3s, "kubectl", "rollout", "restart", "deployment/${manifest.sid}"
			ignoreExitValue = true
		}
	}

	if (manifest.hasService) {
		logger.lifecycle(" browser: ${manifest.ingressUrl} | Liferay: ${k3sHost}:${nodePort}")
	}
}

tasks.register("deployClientExtensions") {
	description = "Build (or unpack) each Client Extension and deploy it into k3s."
	group = "liferay k8s"

	doLast {
		discoverClientExtensions().each {
			File entry ->

			deployOneCx(entry)
		}
	}
}

// Per-CX convenience: from a CX module dir, `../../gradlew deployToK3s` rebuilds
// just that CX and rolls its pod (build -> image -> import -> apply -> restart).

gradle.projectsEvaluated {
	rootProject.allprojects.each {
		Project subproject ->

		Task zipTask = subproject.tasks.findByName("buildClientExtensionZip")

		if (!zipTask) {
			return
		}

		subproject.tasks.register("deployToK3s") {
			description = "Rebuild this client extension and (re)deploy + restart it in k3s."
			group = "liferay k8s"

			dependsOn zipTask

			doLast {
				File zip = zipTask.outputs.files.files.find {
					it.name.endsWith(".zip")
				}

				if (!zip) {
					throw new GradleException("no built zip from ${zipTask.path}")
				}

				rootProject.deployOneCx(zip)
			}
		}
	}
}

tasks.register("renderClientExtensions") {
	description = "Print the manifests that would be applied (no docker, no cluster)."
	group = "liferay k8s"

	doLast {
		discoverClientExtensions().each {
			File entry ->

			String name = entry.isDirectory() ? entry.name : (entry.name - ".zip")

			File dir = materialize(entry)

			if (!new File(dir, "LCP.json").exists()) {
				return
			}

			Map manifest = manifestFor(dir, name)

			def nodePort = manifest.hasService ? nodePortFor(manifest.sid) : null

			println "# ===== ${manifest.vid}/${manifest.sid} image=${manifest.image} ingress=${manifest.ingressUrl} ====="

			if (manifest.serviceJson) {
				println JsonOutput.prettyPrint(manifest.serviceJson)
			}

			println JsonOutput.prettyPrint(manifest.restFor(nodePort))
		}
	}
}

// Reproduces the old CRD printer columns (Phase / App-ID / URL / Image), but
// live, read from the native objects instead of an operator-maintained status.

tasks.register("clientExtensionStatus") {
	description = "Show a CRD-style status table for deployed Client Extensions."
	group = "liferay k8s"

	doLast {
		exec {
			commandLine "docker", "exec", k3s, "kubectl", "get", "deploy,job", "-l", managedLabel, "-o", "custom-columns=NAME:.metadata.name,APP-ID:.metadata.annotations.lxc\\.liferay\\.com/app-id,INSTANCE:.metadata.annotations.lxc\\.liferay\\.com/virtual-instance,READY:.status.readyReplicas,URL:.metadata.annotations.lxc\\.liferay\\.com/url,IMAGE:.spec.template.spec.containers[0].image"
		}
	}
}

// Deploy a minimal traefik ingress controller DIRECTLY (image pre-imported so
// the pod never pulls). Lean alternative to k3s's built-in traefik +
// helm-controller. CX deploys depend on it so the <sid>.<vid>.localtest.me
// Ingresses have a router.

tasks.register("deployIngress") {
	description = "Deploy a minimal traefik ingress controller (hostPort 80) into k3s."
	group = "liferay k8s"

	doLast {
		exec {
			commandLine "bash", "-c", "docker image inspect ${traefikImage} >/dev/null 2>&1 || docker pull -q ${traefikImage}; docker save ${traefikImage} | docker exec -i ${k3s} ctr -a ${containerdSocket} -n k8s.io images import -"
		}

		kubectlApply(file("compose-recipes/k3s/traefik.yaml").text)

		exec {
			commandLine "docker", "exec", k3s, "kubectl", "-n", "kube-system", "rollout", "status", "deploy/traefik", "--timeout=90s"
			ignoreExitValue = true
		}
	}
}

tasks.matching {
	it.name == "deployClientExtensions"
}.all {
	it.dependsOn "deployIngress"
}

// Give the PortalK8sAgent direct API credentials (the production model, no
// unauthenticated proxy). Apply the ServiceAccount + RBAC, mint a long-lived
// token, read the cluster CA, and write the PortalK8sAgentConfiguration into
// Liferay's hot-deploy folder via docker exec — which runs as the liferay user
// and writes into the real deploy dir (a symlink to /mnt/liferay/deploy), so
// there is no shared volume, no populate race, and the trial license is
// untouched. The agent then reaches the API server directly at k3s:6443.

tasks.register("deployAgentCredentials") {
	description = "Deploy the PortalK8sAgent ServiceAccount credentials + config to Liferay."
	group = "liferay k8s"

	doLast {
		kubectlApply(file("compose-recipes/k3s/agent-rbac.yaml").text)

		String token = ""

		for (int i = 0; i < 30; i++) {
			ByteArrayOutputStream tokenOut = new ByteArrayOutputStream()

			exec {
				commandLine "docker", "exec", k3s, "kubectl", "get", "secret", "liferay-portal-k8s-agent-token", "-n", "default", "-o", "jsonpath={.data.token}"
				ignoreExitValue = true
				standardOutput = tokenOut
			}

			token = tokenOut.toString().trim()

			if (token) {
				break
			}

			Thread.sleep(2000)
		}

		if (!token) {
			throw new GradleException("timed out waiting for the ServiceAccount token")
		}

		ByteArrayOutputStream caCertOutputStream = new ByteArrayOutputStream()

		exec {
			commandLine "docker", "exec", k3s, "kubectl", "get", "secret", "liferay-portal-k8s-agent-token", "-n", "default", "-o", "jsonpath={.data.ca\\.crt}"
			standardOutput = caCertOutputStream
		}

		String caCertData = caCertOutputStream.toString().trim()
		String saToken = new String(token.decodeBase64())

		Map<String, String> configFiles = [
			"com.liferay.portal.k8s.agent.configuration.PortalK8sAgentConfiguration.config": """\
active="true"
apiServerHost="k3s"
apiServerPort="6443"
apiServerSSL="true"
caCertData="${caCertData}"
enabled="true"
namespace="default"
saToken="${saToken}"
portalK8sConfigurationPropertiesMutators.cardinality.minimum=I"2"
""",

			// Disable the BaseURL mutator's company lookup so it does not overwrite
			// the baseURL the plugin sets (ingress for browser CX, NodePort for
			// objectAction). This leaves the Annotations + Labels mutators,
			// satisfying cardinality.minimum=2.
			"com.liferay.portal.k8s.agent.internal.mutator.BaseURLPortalK8sConfigurationPropertiesMutator.config": "_companyLocalService.target=\"(service.vendor=this.is.the.only.way.to.disable.this.component.i.could.find)\"\n"
		]

		configFiles.each {
			name, content ->

			exec {
				commandLine "docker", "exec", "-i", liferayContainer, "sh", "-c", "cat > /opt/liferay/deploy/${name}"
				standardInput = new ByteArrayInputStream(content.getBytes("UTF-8"))
			}
		}

		logger.lifecycle("PortalK8sAgent credentials deployed to Liferay (direct API access at k3s:6443)")
	}
}

// Connect to the cluster from the host: writes a kubeconfig pointing at the k3s
// container's IP (reachable directly on Linux; the k3s serving cert already
// lists that IP). Re-run after a restart (the container IP can change).

tasks.register("k3sKubeconfig") {
	description = "Write a host kubeconfig for the k3s cluster to build/kubeconfig."
	group = "liferay k8s"

	doLast {
		ByteArrayOutputStream ipOut = new ByteArrayOutputStream()

		exec {
			commandLine "docker", "inspect", "-f", "{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}", k3s
			standardOutput = ipOut
		}

		String containerIp = ipOut.toString().trim()

		if (!containerIp) {
			throw new GradleException("k3s container '${k3s}' is not running")
		}

		ByteArrayOutputStream configOut = new ByteArrayOutputStream()

		exec {
			commandLine "docker", "exec", k3s, "cat", "/etc/rancher/k3s/k3s.yaml"
			standardOutput = configOut
		}

		File out = file("${buildDir}/kubeconfig")

		out.parentFile.mkdirs()

		out.text = configOut.toString().replace("127.0.0.1", containerIp)

		logger.lifecycle("kubeconfig written: ${out} (server https://${containerIp}:6443)")
		logger.lifecycle(" export KUBECONFIG=${out}")
		logger.lifecycle(" kubectl get pods -A")
	}
}